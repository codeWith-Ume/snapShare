
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | snapShare</title>

    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
<body>

    <div class="auth-container">
        <div class="auth-box">

            <h1>Create Your Account</h1>
            <p>Join our community and explore campus memories.</p>

            {% if errors %}
                <div class="error-message">
                    {% for error in errors %}
                        <p>{{ error }}</p>
                    {% endfor %}
                </div>
            {% endif %}

            {% if success %}
                <div class="success-message">
                    <p>{{ success }}</p>
                </div>
            {% endif %}

            <form method="POST">
                {% csrf_token %}

                <input
                    type="text"
                    name="full_name"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="email"
                    name="email"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm Password"
                    required
                >

                <button type="submit">Sign Up</button>
            </form>

            <p class="switch-page">
                Already have an account?
                <a href="{% url 'login' %}">Login</a>
            </p>

        </div>
    </div>

</body>
</html>
