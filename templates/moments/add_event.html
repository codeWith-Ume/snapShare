
<!DOCTYPE html>
<html>
<head>
    <title>Create Event - Our Memories</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.55)),
                        url("/static/images/add_event_background.jpeg");
            background-size: cover;
            background-position: center;
        }

        .event-container {
            width: 90%;
            max-width: 450px;
            padding: 35px;
            border-radius: 16px;
            background: rgba(255,255,255,0.92);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #555;
        }

        .errorlist {
            color: #c62828;
            font-size: 14px;
            padding-left: 20px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

    </style>
</head>

<body>

    <div class="event-container">

        <h1>Create New Event</h1>

        <p class="subtitle">
            Give your memories a name and date.
        </p>

        <form method="POST">
            {% csrf_token %}

            {{ form.non_field_errors }}

            <div class="form-group">
                <label for="{{ form.name.id_for_label }}">Event Name</label>
                {{ form.name }}
                {{ form.name.errors }}
            </div>

            <div class="form-group">
                <label for="{{ form.date.id_for_label }}">Event Date</label>
                {{ form.date }}
                {{ form.date.errors }}
            </div>

            <button type="submit">Create Event</button>

        </form>

    </div>
<script>
window.addEventListener("pageshow", function(event) {
    const navigation = performance.getEntriesByType("navigation")[0];

    if (event.persisted || (navigation && navigation.type === "back_forward")) {
        window.location.replace("{% url 'moments_home' %}");
    }
});
</script>
</body>
</html>
